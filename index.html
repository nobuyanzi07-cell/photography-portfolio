<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nathan's Photography Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nathan Photography </h1>
    <p><em>Capturing moments, telling stories.</em></p>
    <nav>
      <a href="index.html">Home</a> | 
      <a href="about.html">About</a>
    </nav>
  </header>

  <section id="intro">
    <p>Photography is a way of feeling, touching, and loving. What you have caught on film is captured forever.</p>
  </section>

  <section id="favorites">
    <h2>My Favorite Photos</h2>
    <ul>
      <li><img src="images/sunsets.jpg" alt="Sunset"></li>
      <li><img src="images/wildlife.jpg" alt="Wildlife"></li>
      <li><img src="images/street.jpg" alt="Street scene"></li>
    </ul>
  </section> 

<section id="contact">
    <h2>Contact Me</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" required>
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <textarea placeholder="Your message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Nathan Photography</p>
  </footer>
</body>
</html>
